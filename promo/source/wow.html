    <!-- Core Animation Engine -->
    <script>
        // Inline inclusion of assets/animations.jsx functionality
        (function() {
            const { createContext, useContext, useState, useEffect, useRef, useCallback } = React;
            const TimeContext = createContext({ time: 0, duration: 12 });
            const SpriteContext = createContext(null);
            const Easing = {
                linear: t => t,
                easeIn: t => t * t,
                easeOut: t => 1 - (1 - t) * (1 - t),
                easeInOut: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
                expoOut: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
                overshoot: t => {
                    const c1 = 1.70158, c3 = c1 + 1;
                    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
                }
            };
            function interpolate(t, input, output, easing) {
                const [inStart, inEnd] = input;
                const [outStart, outEnd] = output;
                if (t <= inStart) return outStart;
                if (t >= inEnd) return outEnd;
                let progress = (t - inStart) / (inEnd - inStart);
                if (easing) progress = easing(progress);
                return outStart + (outEnd - outStart) * progress;
            }
            function Stage({ duration = 12, children }) {
                const [time, setTime] = useState(0);
                useEffect(() => {
                    let start = performance.now();
                    let raf;
                    const tick = (now) => {
                        const elapsed = (now - start) / 1000;
                        setTime(elapsed % duration);
                        raf = requestAnimationFrame(tick);
                    };
                    raf = requestAnimationFrame(tick);
                    return () => cancelAnimationFrame(raf);
                }, [duration]);
                return React.createElement(TimeContext.Provider, { value: { time, duration } }, 
                    React.createElement('div', { style: { position: 'relative', width: '100%', height: '100%', overflow: 'hidden', background: '#05070a' } }, children)
                );
            }
            function Sprite({ start = 0, end, children }) {
                const { time } = useContext(TimeContext);
                const actualEnd = end || 12;
                if (time < start || time >= actualEnd) return null;
                const t = (time - start) / (actualEnd - start);
                return React.createElement(SpriteContext.Provider, { value: { t, elapsed: time - start } }, children);
            }
            window.Animations = { Stage, Sprite, Easing, interpolate, useTime: () => useContext(TimeContext).time, useSprite: () => useContext(SpriteContext) };
        })();
    </script>

    <script type="text/babel">
        const { Stage, Sprite, Easing, interpolate, useSprite, useTime } = window.Animations;

        const colors = {
            orange: '#f0883e',
            deep: '#05070a',
            grid: 'rgba(240, 136, 62, 0.05)',
            text: '#e6edf3',
            success: '#3fb950'
        };

        const GridBackground = () => {
            const time = useTime();
            const opacity = interpolate(time, [0, 2], [0, 1], Easing.easeOut);
            return (
                <div style={{
                    position: 'absolute',
                    inset: -100,
                    backgroundImage: `linear-gradient(${colors.grid} 1px, transparent 1px), linear-gradient(90deg, ${colors.grid} 1px, transparent 1px)`,
                    backgroundSize: '60px 60px',
                    opacity,
                    transform: `perspective(1000px) rotateX(60deg) translateY(${time * 20}px)`,
                    zIndex: 0
                }} />
            );
        };

        const Core = () => {
            const { t } = useSprite();
            const scale = interpolate(t, [0, 0.5], [0, 1], Easing.overshoot);
            const glow = interpolate(t, [0.4, 0.6], [0, 40], Easing.easeOut);
            const rotation = t * 360;

            return (
                <div style={{
                    position: 'absolute',
                    top: '50%',
                    left: '50%',

                    zIndex: 10
                }}>

                        width: 180,
                        height: 180,
                        background: colors.orange,

            const currentY = interpolate(progress, [0, 1], [y, 0]);

            return (

                    position: 'absolute',
                    top: '50%',
                    left: '50%',
                    transform: `translate(${currentX}px, ${currentY}px)`,
                    width: 4,

                    opacity,
                    zIndex: 5

            const y = active ? interpolate(elapsed - delay, [0, 0.5], [20, 0], Easing.easeOut) : 20;

                    opacity,
                    transform: `translateY(${y}px)`,
                    color: colors.text,

                            height: 600,

                            borderRadius: '50%',
                            boxShadow: `inset 0 0 50px rgba(63, 185, 80, 0.2)`,
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            animation: 'pulse 2s infinite ease-in-out',
                            zIndex: 20
                        }}>
                            <div style={{ 
                                background: 'rgba(63, 185, 80, 0.1)',
                                padding: '20px 40px',
                                borderRadius: 100,
                                border: `1px solid ${colors.success}`,
                                color: colors.success,
                                fontFamily: 'Inter',
                                fontWeight: 'bold',
                                fontSize: 18,
                                letterSpacing: '0.1em'
                            }}>
                                🔒 PRIVACY SHIELD ACTIVE
                            </div>
                        </div>
                    </Sprite>

                    <style>{`
                        @keyframes pulse {
                            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.5; }
                            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
                            100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.5; }
                        }
                    `}</style>
                </Stage>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
