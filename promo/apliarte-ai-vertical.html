<script>
/* ─── Animation Engine (inline from animations.jsx) ─── */
(function() {
    const { createContext, useContext, useState, useEffect, useRef } = React;
    const TimeContext = createContext({ time: 0, duration: 20 });
    const SpriteContext = createContext(null);
    const Easing = {
        linear: t => t,
        easeOut: t => 1 - (1 - t) * (1 - t),
        easeInOut: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
        expoOut: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
        overshoot: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
    };
    function interpolate(t, input, output, easing) {
        const [iS, iE] = input; const [oS, oE] = output;
        if (t <= iS) return oS; if (t >= iE) return oE;
        let p = (t - iS) / (iE - iS);
        if (easing) p = easing(p);
        return oS + (oE - oS) * p;
    }
    function Stage({ duration = 20, width = 1080, height = 1920, children }) {
        const [time, setTime] = useState(0);
        const [scale, setScale] = useState(1);
        useEffect(() => {
            function updateScale() {
                const vw = window.innerWidth; const vh = window.innerHeight;
                setScale(Math.min(vw / width, vh / height));
            }
            updateScale(); window.addEventListener('resize', updateScale);
            return () => window.removeEventListener('resize', updateScale);
        }, [width, height]);
        useEffect(() => {
            let last = null, raf;
            const effectiveLoop = (typeof window !== 'undefined' && window.__recording) ? false : true;
            const tick = (now) => {
                if (last === null) { last = now; if (typeof window !== 'undefined') window.__ready = true; }
                const delta = (now - last) / 1000; last = now;
                setTime(prev => {
                    const next = prev + delta;
                    if (next >= duration) return effectiveLoop ? 0 : duration - 0.001;
                    return next;
                });
                raf = requestAnimationFrame(tick);
            };
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { raf = requestAnimationFrame(tick); });
            else raf = requestAnimationFrame(tick);
            return () => cancelAnimationFrame(raf);
        }, [duration]);
        return React.createElement(TimeContext.Provider, { value: { time, duration } },
            React.createElement('div', { style: { position: 'fixed', inset: 0, background: '#000', display: 'flex', alignItems: 'center', justifyContent: 'center' } },
                React.createElement('div', { style: { width, height, position: 'relative', overflow: 'hidden', transform: `scale(${scale})`, transformOrigin: 'center center', background: '#05080f' } }, children)
            )
        );
    }
    function Sprite({ start = 0, end, children }) {
        const { time } = useContext(TimeContext);
        const aE = end || 20;
        if (time < start || time >= aE) return null;
        const t = (time - start) / (aE - start);
        return React.createElement(SpriteContext.Provider, { value: { t, elapsed: time - start, duration: aE - start } }, children);
    }
    window.Animations = { Stage, Sprite, Easing, interpolate, useTime: () => useContext(TimeContext).time, useSprite: () => useContext(SpriteContext) };
})();
</script>

<script type="text/babel">
const { Stage, Sprite, Easing, interpolate, useTime, useSprite } = window.Animations;

/* ─── Brand Colors (Blue Palette) ─── */
const C = {
    bg:       '#05080f',
    surface:  '#0c1220',
    blue1:    '#1e40af',   // deep blue
    blue2:    '#3b82f6',   // main blue
    blue3:    '#60a5fa',   // light blue
    blue4:    '#93c5fd',   // pale blue
    accent:   '#38bdf8',   // cyan accent
    text:     '#e2e8f0',
    textDim:  '#94a3b8',
    success:  '#22c55e',
    glow:     'rgba(59, 130, 246, 0.4)',
};

/* ─── Utility Components ─── */

const GridBg = () => {
    const time = useTime();
    const opacity = interpolate(time, [0, 2], [0, 0.15], Easing.easeOut);
    return (
        <div style={{
            position: 'absolute', inset: -200,
            backgroundImage: `linear-gradient(rgba(59,130,246,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(59,130,246,0.06) 1px, transparent 1px)`,
            backgroundSize: '80px 80px',
            opacity,
            transform: `perspective(900px) rotateX(55deg) translateY(${(time * 15) % 80}px)`,
            zIndex: 0
        }} />
    );
};

const GlowOrb = ({ x, y, size, delay, color }) => {
    const time = useTime();
    const opacity = interpolate(time, [delay, delay + 1.5], [0, 0.25], Easing.easeOut) *
                    (0.7 + 0.3 * Math.sin(time * 1.2 + delay));
    return (
        <div style={{
            position: 'absolute', left: x, top: y,
            width: size, height: size,
            borderRadius: '50%',
            background: `radial-gradient(circle, ${color} 0%, transparent 70%)`,
            opacity, filter: 'blur(40px)',
            zIndex: 1
        }} />
    );
};

const TextReveal = ({ text, delay, size = 28, color = C.text, weight = 400, mono = false, letterSpacing = '0em' }) => {
    const { elapsed } = useSprite();
    const active = elapsed > delay;
    const opacity = active ? interpolate(elapsed - delay, [0, 0.4], [0, 1], Easing.expoOut) : 0;
    const y = active ? interpolate(elapsed - delay, [0, 0.4], [30, 0], Easing.expoOut) : 30;
    return (
        <div style={{
            opacity, transform: `translateY(${y}px)`,
            color, fontSize: size, fontWeight: weight,
            fontFamily: mono ? "'JetBrains Mono', monospace" : "'Inter', sans-serif",
            letterSpacing, lineHeight: 1.4,
            textShadow: `0 0 20px ${C.glow}`
        }}>
            {text}
        </div>
    );
};

const FeatureCard = ({ icon, title, desc, delay }) => {
    const { elapsed } = useSprite();
    const active = elapsed > delay;
    const opacity = active ? interpolate(elapsed - delay, [0, 0.5], [0, 1], Easing.expoOut) : 0;
    const x = active ? interpolate(elapsed - delay, [0, 0.5], [60, 0], Easing.expoOut) : 60;
    return (
        <div style={{
            opacity, transform: `translateX(${x}px)`,
            background: 'rgba(30, 64, 175, 0.12)',
            border: '1px solid rgba(59, 130, 246, 0.2)',
            borderRadius: 16, padding: '20px 24px',
            marginBottom: 14, backdropFilter: 'blur(10px)',
        }}>
            <div style={{ fontSize: 15, fontWeight: 700, color: C.accent, marginBottom: 6, fontFamily: "'JetBrains Mono', monospace" }}>
                {icon} {title}
            </div>
            <div style={{ fontSize: 14, color: C.textDim, lineHeight: 1.5 }}>
                {desc}
            </div>
        </div>
    );
};

const ScreenshotFrame = ({ src, delay, label }) => {
    const { elapsed } = useSprite();
    const active = elapsed > delay;
    const opacity = active ? interpolate(elapsed - delay, [0, 0.6], [0, 1], Easing.expoOut) : 0;
    const scale = active ? interpolate(elapsed - delay, [0, 0.6], [0.85, 1], Easing.expoOut) : 0.85;
    return (
        <div style={{ opacity, transform: `scale(${scale})`, marginBottom: 16, textAlign: 'center' }}>
            <div style={{
                borderRadius: 16, overflow: 'hidden',
                border: '1px solid rgba(59, 130, 246, 0.3)',
                boxShadow: `0 8px 40px rgba(59, 130, 246, 0.2), 0 0 80px rgba(59, 130, 246, 0.05)`,
            }}>
                <img src={src} style={{ width: '100%', display: 'block' }} />
            </div>
            {label && (
                <div style={{ marginTop: 10, fontSize: 13, color: C.textDim, fontFamily: "'JetBrains Mono', monospace", letterSpacing: '0.05em' }}>
                    {label}
                </div>
            )}
        </div>
    );
};

const Badge = ({ text, delay }) => {
    const { elapsed } = useSprite();
    const active = elapsed > delay;
    const opacity = active ? interpolate(elapsed - delay, [0, 0.3], [0, 1]) : 0;
    const scale = active ? interpolate(elapsed - delay, [0, 0.3], [0.8, 1], Easing.overshoot) : 0.8;
    return (
        <span style={{
            display: 'inline-block', opacity, transform: `scale(${scale})`,
            background: 'rgba(59, 130, 246, 0.15)',
            border: '1px solid rgba(59, 130, 246, 0.3)',
            borderRadius: 8, padding: '6px 14px',
            fontSize: 13, color: C.blue3, fontWeight: 600,
            fontFamily: "'JetBrains Mono', monospace",
            margin: '0 6px 8px 0'
        }}>
            {text}
        </span>
    );
};

                    <div style={{ height: 40 }} />
                    <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center' }}>
                        <Badge text="🔒 Privado" delay={2.2} />
                        <Badge text="🆓 Gratis" delay={2.5} />
                        <Badge text="⚡ Offline" delay={2.8} />
                        <Badge text="🧠 Local" delay={3.1} />
                    </div>
                    <div style={{ height: 60 }} />
                    <TextReveal text="¿Qué hay de nuevo?" delay={3.8} size={20} color={C.textDim} weight={400} mono={true} />
                </div>
            </Sprite>

            {/* ── SCENE 2: MCP Client (5-9s) ── */}
            <Sprite start={5} end={9}>
                <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', padding: '100px 50px 50px', zIndex: 10 }}>
                    <TextReveal text="01" delay={0.1} size={80} color="rgba(59,130,246,0.15)" weight={900} />
                    <TextReveal text="MCP Client" delay={0.4} size={48} color={C.text} weight={800} />
                    <TextReveal text="Genérico" delay={0.6} size={48} color={C.accent} weight={800} />
                    <div style={{ height: 30 }} />
                    <FeatureCard icon="🔗" title="stdio + HTTP" desc="Spawn procesos locales o conecta servidores remotos con session ID." delay={1.0} />
                    <FeatureCard icon="🛠" title="Tool-calling" desc="Loop hasta 10 iteraciones. Compatible con LM Studio y Ollama." delay={1.4} />
                    <FeatureCard icon="📦" title="Stack Templates" desc="Node.js, Python, Go, Full-stack — aplica varios MCP servers de un click." delay={1.8} />
